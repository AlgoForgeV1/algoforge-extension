<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>AlgoForge</title>

    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>

  <body>
    <main class="popup">

      <div class="popup-brand">

        <div class="popup-logo">
          <img
            src="../images/forgey.png"
            alt="Forgey"
          />
        </div>

        <div>
          <h1>AlgoForge</h1>

          <p>
            Capture. Analyze. Improve.
          </p>
        </div>

      </div>

      <div class="popup-card">

        <div class="popup-status">
          <span></span>

          <div>
            <strong>
              Extension ready
            </strong>

            <p>
              Open a LeetCode problem
              to get started.
            </p>
          </div>
        </div>

      </div>

      <div class="popup-footer">
        <span>Forgey is watching 👀</span>
        <span>v0.1.0</span>
      </div>

    </main>

    <script src="popup.js"></script>
  </body>
</html>
